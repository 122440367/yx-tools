name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（例如 v3.0.7）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release notes are generated from the commits since the previous tag.
          fetch-depth: 0

      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            echo "Expected a tag such as v3.0.7" >&2
            exit 1
          fi

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)"
          notes_path=".github/release-notes.generated.md"

          {
            echo "## 改动说明"
            echo
            if [[ -n "$previous_tag" ]]; then
              echo "以下内容来自 `$previous_tag` 到 `$RELEASE_TAG` 之间的实际提交："
              echo
              git log --no-merges --pretty=format:'- `%h` %s' "$previous_tag..$RELEASE_TAG"
              echo
              echo
              echo "### 文件变更统计"
              echo
              echo '```text'
              git diff --stat "$previous_tag" "$RELEASE_TAG"
              echo '```'
            else
              echo "这是仓库的首个版本，以下为该版本提交记录："
              echo
              git log --no-merges --pretty=format:'- `%h` %s' "$RELEASE_TAG"
            fi
            echo
            echo
            echo "## 下载"
            echo
            echo "请根据系统和架构选择对应的压缩包；`checksums.txt` 可用于校验文件完整性。"
          } > "$notes_path"

          echo "Generated release notes:"
          cat "$notes_path"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build binaries
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist

          build() {
            local os="$1"
            local arch="$2"
            local extension="$3"
            local output="dist/yx_${os}_${arch}${extension}"

            echo "Building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "$output" ./cmd/yx
          }

          build darwin  amd64 ''
          build darwin  arm64 ''
          build freebsd amd64 ''
          build linux   386   ''
          build linux   amd64 ''
          build linux   arm64 ''
          build windows amd64 '.exe'
          build windows arm64 '.exe'

      - name: Package release assets
        shell: bash
        working-directory: dist
        run: |
          for binary in yx_*; do
            case "$binary" in
              *.exe) zip -q "${binary%.exe}.zip" "$binary" ;;
              *)     tar -czf "$binary.tar.gz" "$binary" ;;
            esac
          done

          sha256sum *.tar.gz *.zip > checksums.txt
          rm -f \
            yx_darwin_amd64 yx_darwin_arm64 \
            yx_freebsd_amd64 \
            yx_linux_386 yx_linux_amd64 yx_linux_arm64 \
            yx_windows_amd64.exe yx_windows_arm64.exe

          echo 'Release assets:'
          ls -lh
          test "$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 8
          test "$(wc -l < checksums.txt)" -eq 8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yx-${{ env.RELEASE_TAG }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: yx-tools ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.generated.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          fail_on_unmatched_files: true
          make_latest: true
